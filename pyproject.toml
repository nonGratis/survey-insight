[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F   — pycodestyle errors + pyflakes (базовий must-have)
# I     — import sorting (replaces isort)
# B     — flake8-bugbear (anti-patterns)
# UP    — pyupgrade (рекомендує сучасний синтаксис для py311)
# N     — PEP-8 naming
# SIM   — flake8-simplify (читабельність)
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
# E501 (line too long) — ruff-format і так нормалізує довжину, окремо не хочемо noise.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# app.py навмисно викликає setup_logging() ДО будь-яких core/ui імпортів,
# щоб модулі одразу отримали сконфігурований root logger.
"app.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
