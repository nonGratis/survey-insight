name: CI

on:
  push:
    branches: ["main"]
  # Any base branch: stacked PRs (feature -> feature) must be checked too.
  pull_request:

# Least privilege: the jobs only check out and build, so the token needs no write scopes.
permissions:
  contents: read

jobs:
  # Runner pinned on purpose: GitHub moves `ubuntu-latest` to Ubuntu 26 on 2026-10-19.
  # The image should change when we decide, not when the label does.
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements*.txt
            constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      - name: Type check with mypy
        run: mypy core/

      - name: Run tests
        run: pytest tests/ -v

  docker-build:
    runs-on: ubuntu-24.04
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t survey-insight:ci .
